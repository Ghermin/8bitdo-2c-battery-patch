name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = [Reflection.AssemblyName]::GetAssemblyName("$PWD/out/8bitdo-2c-battery-patch.exe").Version
          $exe = "$($v.Major).$($v.Minor).$($v.Build)"
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($exe -ne $tag) { Write-Error "Tag v$tag but AssemblyVersion $exe in src/Program.cs"; exit 1 }
      - uses: actions/upload-artifact@v5
        with:
          name: 8bitdo-2c-battery-patch
          path: out/8bitdo-2c-battery-patch.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: 8bitdo-2c-battery-patch
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Download \`8bitdo-2c-battery-patch.exe\`, put it in a folder of its own and run it. Instructions: https://github.com/$GITHUB_REPOSITORY#how-to-use" \
            dist/8bitdo-2c-battery-patch.exe
